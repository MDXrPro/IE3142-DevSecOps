name: WebGoat CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep SAST
        run: |
          semgrep \
            --config p/java \
            --config evidence/ssrf/sast/ssrf-sast-rule.yml \
            --error \
            application/WebGoat/src/main/java/org/owasp/webgoat/lessons/sqlinjection/introduction/SqlInjectionLesson9.java \
            application/WebGoat/src/main/java/org/owasp/webgoat/lessons/ssrf/SSRFTask2.java

  build-and-test:
    name: Build and Test WebGoat
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: application/WebGoat
        run: chmod +x mvnw

      - name: Build and test
        working-directory: application/WebGoat
        run: ./mvnw -B clean test -P!start-server
